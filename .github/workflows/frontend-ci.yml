name: Taskflow frontend CI

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v7
    
      - name: setup-nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 22
    
      - name: install-dependencies
        run: npm ci
    
      - name: run-tests
        run: npm test
    
      - name: build-frontend
        run: npm run build
